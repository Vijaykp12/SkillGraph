apiVersion: v1
kind: Namespace
metadata:
  name: skillgraph
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillgraph-config
  namespace: skillgraph
data:
  POSTGRES_SERVER: "postgres-service"
  POSTGRES_DB: "skillgraph"
  NEO4J_URI: "bolt://neo4j-service:7687"
  REDIS_HOST: "redis-service"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: skillgraph
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: skillgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "skillgraph"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j-service
  namespace: skillgraph
spec:
  ports:
    - name: bolt
      port: 7687
    - name: http
      port: 7474
  selector:
    app: neo4j
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j-deployment
  namespace: skillgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.12-community
          env:
            - name: NEO4J_AUTH
              value: "neo4j/password"
          ports:
            - containerPort: 7687
            - containerPort: 7474
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: skillgraph
spec:
  ports:
    - port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: skillgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: skillgraph
spec:
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: skillgraph
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: skillgraph-backend:latest
          envFrom:
            - configMapRef:
                name: skillgraph-config
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              value: "password"
            - name: SECRET_KEY
              value: "supersecretkeychangeinproduction"
          ports:
            - containerPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: skillgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: skillgraph-backend:latest
          command: ["celery", "-A", "app.workers.tasks.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: skillgraph-config
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              value: "password"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: skillgraph
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: skillgraph
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: skillgraph-frontend:latest
          ports:
            - containerPort: 3000

services:
  postgres:
    image: postgres:15-alpine
    container_name: skillgraph-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skillgraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skillgraph-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5.12-community
    container_name: skillgraph-graph
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: "128m"
      NEO4J_server_memory_heap_max__size: "256m"
      NEO4J_server_memory_pagecache_size: "64m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: cypher-shell -u neo4j -p password "RETURN 1"
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: skillgraph-backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=skillgraph
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_HOST=redis
      - SECRET_KEY=supersecretkeychangeinproduction
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: skillgraph-worker
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=skillgraph
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_HOST=redis
    depends_on:
      - redis
      - neo4j

  celery_beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: skillgraph-beat
    command: celery -A app.workers.tasks.celery_app beat --loglevel=info
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: skillgraph-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
